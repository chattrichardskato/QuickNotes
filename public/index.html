<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>QuickNotes</h1>
    <form id="note-form">
      <input type="text" id="note-input" placeholder="Write a note..." autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="note-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
